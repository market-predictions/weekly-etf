name: Diagnose ETF report integrity post-render gates

on:
  push:
    branches:
      - main
    paths:
      - "control/run_queue/etf_report_integrity_post_render_diagnostic_*.md"

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      MRKT_RPRTS_REPORT_MODE: pro
      MRKT_RPRTS_COCKPIT_FRONT_PAGE: enabled
      MRKT_RPRTS_EXPLICIT_REPORT_PATH: output/weekly_analysis_pro_260724_07.md
      MRKT_RPRTS_EXPLICIT_REPORT_PATH_NL: output/weekly_analysis_pro_nl_260724_07.md
      MRKT_RPRTS_RUNTIME_STATE_PATH: output/runtime/etf_report_state_20260724_20260726_165219.json
      ETF_RUNTIME_STATE_PATH: output/runtime/etf_report_state_20260724_20260726_165219.json
      MRKT_RPRTS_PRICING_AUDIT_PATH: output/pricing/price_audit_2026-07-24_20260726_165219.json
      ETF_PRICING_AUDIT_PATH: output/pricing/price_audit_2026-07-24_20260726_165219.json
      MRKT_RPRTS_LANE_ARTIFACT_PATH: output/lane_reviews/etf_lane_assessment_260724.json
      MRKT_RPRTS_ROTATION_PLAN_PATH: output/runtime/etf_rotation_plan_260724_20260726_165219.json

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system and Python dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2 libpango-1.0-0 libgdk-pixbuf-2.0-0 libffi-dev shared-mime-info fonts-liberation fonts-dejavu-core fonts-lato poppler-utils
          python -m pip install --upgrade pip
          pip install matplotlib mistune weasyprint pyyaml pandas yfinance

      - name: Replay post-render gates independently
        run: |
          set +e
          mkdir -p output/run_manifests /tmp/etf_post_render
          run_gate() {
            name="$1"
            shift
            "$@" > "/tmp/etf_post_render/${name}.log" 2>&1
            echo $? > "/tmp/etf_post_render/${name}.status"
          }

          run_gate lane_breadth python validate_lane_breadth.py
          run_gate replacement_duels python validate_replacement_duels.py
          run_gate bilingual_pair python -c "from pathlib import Path; import send_report_runtime_html as srh; sr=srh.report_module; p=Path('output/weekly_analysis_pro_260724_07.md'); sr.validate_bilingual_pair(p); print('BILINGUAL_PAIR_OK')"
          run_gate pdf_visual python tools/validate_etf_pdf_visual_contract.py --output-dir output
          run_gate macro_leakage python tools/validate_etf_macro_thesis_surface_leakage.py --output-dir output
          run_gate delivery_html python tools/validate_etf_delivery_html_contract.py --output-dir output
          run_gate client_surface python tools/validate_etf_client_surface_clean.py --output-dir output
          run_gate state_minimum python tools/write_etf_minimum_state.py --output-dir output --mode pro --check-only
          run_gate state_ledger python tools/write_etf_trade_ledger.py --output-dir output --check-only
          run_gate state_scorecard python tools/write_etf_recommendation_scorecard.py --output-dir output --mode pro --check-only
          run_gate portfolio_integrity python tools/validate_etf_report_portfolio_integrity.py --runtime-state "$ETF_RUNTIME_STATE_PATH" --english-report "$MRKT_RPRTS_EXPLICIT_REPORT_PATH" --dutch-report "$MRKT_RPRTS_EXPLICIT_REPORT_PATH_NL"

          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('/tmp/etf_post_render')
          results = {}
          for status_path in sorted(root.glob('*.status')):
              name = status_path.stem
              code = int(status_path.read_text().strip())
              log_path = root / f'{name}.log'
              log = log_path.read_text(encoding='utf-8', errors='replace') if log_path.exists() else ''
              results[name] = {'exit_code': code, 'log_tail': log[-6000:]}
          payload = {
              'artifact_type': 'weekly_etf_report_integrity_post_render_diagnostic',
              'source_run_id': '20260726_165219',
              'status': 'completed' if all(v['exit_code'] == 0 for v in results.values()) else 'failed',
              'results': results,
          }
          out = Path('output/run_manifests/weekly_etf_report_integrity_post_render_diagnostic_20260726_165219.json')
          out.write_text(json.dumps(payload, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(payload, indent=2))
          PY

      - name: Commit diagnostic evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/run_manifests/weekly_etf_report_integrity_post_render_diagnostic_20260726_165219.json
          git commit -m "Persist ETF report-integrity post-render diagnostic [skip ci]"
          git push origin HEAD:main
