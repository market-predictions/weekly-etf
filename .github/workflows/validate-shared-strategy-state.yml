name: Validate shared ETF strategy state

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "runtime/build_shared_strategy_state.py"
      - "runtime/build_shared_portfolio_target.py"
      - "tools/validate_shared_strategy_state.py"
      - "tools/validate_shared_portfolio_target.py"
      - "tools/validate_shared_contract_release.py"
      - "schemas/etf_shared_strategy_state.schema.json"
      - "schemas/etf_shared_portfolio_target.schema.json"
      - "control/ETF_SHARED_CONTRACT_PROMOTION_POLICY_V1.md"
      - "control/releases/ETF_SHARED_CONTRACT_RELEASE_1_0_0.json"
      - ".github/workflows/validate-shared-strategy-state.yml"
      - "control/work_packages/WP_SYNC_00_01_SHARED_STRATEGY_STATE_20260727.md"

permissions:
  contents: read

jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate shared contract release manifest
        run: |
          python tools/validate_shared_contract_release.py \
            control/releases/ETF_SHARED_CONTRACT_RELEASE_1_0_0.json

      - name: Build latest shared strategy state
        run: |
          mkdir -p output/shared
          python runtime/build_shared_strategy_state.py --output output/shared/etf_shared_strategy_state_ci.json

      - name: Validate shared strategy state
        run: |
          python tools/validate_shared_strategy_state.py output/shared/etf_shared_strategy_state_ci.json

      - name: Build shared exposure portfolio target
        run: |
          python runtime/build_shared_portfolio_target.py \
            --shared-strategy-state output/shared/etf_shared_strategy_state_ci.json \
            --output output/shared/etf_shared_portfolio_target_ci.json

      - name: Validate shared exposure portfolio target
        run: |
          python tools/validate_shared_portfolio_target.py output/shared/etf_shared_portfolio_target_ci.json

      - name: Prove builders are deterministic apart from generated timestamp
        run: |
          python runtime/build_shared_strategy_state.py --output output/shared/etf_shared_strategy_state_ci_second.json
          python runtime/build_shared_portfolio_target.py \
            --shared-strategy-state output/shared/etf_shared_strategy_state_ci.json \
            --output output/shared/etf_shared_portfolio_target_ci_second.json
          python - <<'PY'
          import json
          from pathlib import Path

          pairs = [
              ("output/shared/etf_shared_strategy_state_ci.json", "output/shared/etf_shared_strategy_state_ci_second.json"),
              ("output/shared/etf_shared_portfolio_target_ci.json", "output/shared/etf_shared_portfolio_target_ci_second.json"),
          ]
          for first_path, second_path in pairs:
              first = json.loads(Path(first_path).read_text())
              second = json.loads(Path(second_path).read_text())
              first.pop("generated_at_utc", None)
              second.pop("generated_at_utc", None)
              if first != second:
                  raise SystemExit(f"Artifact is not deterministic: {first_path}")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: etf-shared-strategy-state-shadow
          path: |
            control/releases/ETF_SHARED_CONTRACT_RELEASE_1_0_0.json
            output/shared/etf_shared_strategy_state_ci.json
            output/shared/etf_shared_portfolio_target_ci.json
          if-no-files-found: error
