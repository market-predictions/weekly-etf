name: Apply ETF zero-trade and Dutch-history fix

on:
  push:
    branches:
      - main
    paths:
      - "control/run_queue/etf_zero_trade_nl_history_fix_*.md"

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pytest pyyaml

      - name: Apply source fix
        run: python tools/apply_etf_zero_trade_and_nl_history_fix.py

      - name: Compile and test
        run: |
          python -m py_compile runtime/etf_instrument_constraints.py runtime/render_etf_report_nl_from_state.py tools/validate_etf_rotation_output_contract.py tools/validate_etf_report_portfolio_integrity.py
          python -m pytest tests/test_etf_zero_trade_and_nl_history.py
          python -m pytest tests/test_etf_instrument_constraints.py
          python -m pytest tests/test_etf_report_portfolio_integrity.py

      - name: Commit validated fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runtime/etf_instrument_constraints.py runtime/render_etf_report_nl_from_state.py tools/validate_etf_rotation_output_contract.py .github/workflows/send-weekly-report.yml
          git commit -m "Remove stale zero-trade status and localize ETF history"
          git push origin HEAD:main
