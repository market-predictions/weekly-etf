name: Validate ETF cockpit action and language

on:
  push:
    branches:
      - main
    paths:
      - "control/run_queue/weekly_etf_cockpit_action_language_validation_*.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
      MRKT_RPRTS_COCKPIT_FRONT_PAGE: enabled
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install focused dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pyyaml

      - name: Compile focused implementation
        run: |
          python -m py_compile \
            runtime/__init__.py \
            runtime/cockpit_action_surface_contract.py \
            runtime/render_cockpit_front_page.py \
            runtime/additive_cockpit_front_page.py \
            runtime/report_surface_language_contract.py \
            runtime/wp16_followup3_cleanup.py \
            tests/test_etf_cockpit_action_and_constraint_language.py

      - name: Run focused regressions
        run: |
          pytest -q \
            tests/test_etf_cockpit_action_and_constraint_language.py \
            tests/test_etf_post_execution_report_consistency.py \
            tests/test_rotation_budget_language_cleanup.py

      - name: Replay delivered mismatch and corrected no-action state
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          from runtime.additive_cockpit_front_page import (
              render_delivery_cockpit_front_page_fragment,
          )
          from runtime.wp16_followup3_cleanup import clean_text, failures

          output_dir = Path("output")
          old_state = "output/runtime/etf_report_state_20260724_20260726_121721.json"
          corrected_state = "output/runtime/etf_report_state_20260724_20260726_124934.json"

          old_en = render_delivery_cockpit_front_page_fragment(
              output_dir=output_dir,
              language="en",
              render_mode="email",
              runtime_state=old_state,
          ).html
          old_nl = render_delivery_cockpit_front_page_fragment(
              output_dir=output_dir,
              language="nl",
              render_mode="email",
              runtime_state=old_state,
          ).html
          assert "Proposed — not executed" in old_en, old_en[:2000]
          assert "SMH -2.00% NAV" in old_en and "DFEN +2.00% NAV" in old_en
          assert "Voorgesteld — niet uitgevoerd" in old_nl, old_nl[:2000]
          assert "SMH -2.00% NAV" in old_nl and "DFEN +2.00% NAV" in old_nl

          corrected_en = render_delivery_cockpit_front_page_fragment(
              output_dir=output_dir,
              language="en",
              render_mode="email",
              runtime_state=corrected_state,
          ).html
          corrected_nl = render_delivery_cockpit_front_page_fragment(
              output_dir=output_dir,
              language="nl",
              render_mode="email",
              runtime_state=corrected_state,
          ).html
          assert "No change proposed or executed" in corrected_en
          assert "current weights remain unchanged" in corrected_en
          assert "Geen wijziging voorgesteld of uitgevoerd" in corrected_nl
          assert "huidige gewichten blijven ongewijzigd" in corrected_nl

          for language, path in (
              ("en", Path("output/weekly_analysis_pro_260724_03.md")),
              ("nl", Path("output/weekly_analysis_pro_nl_260724_03.md")),
          ):
              cleaned = clean_text(path.read_text(encoding="utf-8"), language=language)
              assert failures(cleaned, language=language) == [], failures(cleaned, language=language)
              assert "override" not in cleaned.lower()

          corrected_payload = json.loads(Path(corrected_state).read_text(encoding="utf-8"))
          assert corrected_payload.get("trade_intents") == []
          assert corrected_payload["rotation_plan"]["trade_intents"] == []
          print("ETF_COCKPIT_ACTION_LANGUAGE_OK | old_proposal=visible | corrected_no_action=explicit | override_residue=none | trade_intents=0")
          PY

      - name: Persist validation evidence
        if: always()
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          payload = {
              "schema_version": "1.0",
              "artifact_type": "weekly_etf_cockpit_action_language_validation",
              "created_at_utc": datetime.now(timezone.utc).isoformat(),
              "github_run_id": os.environ.get("GITHUB_RUN_ID"),
              "status": "completed",
              "contract": {
                  "delivered_proposal_visible_on_front_page": True,
                  "corrected_zero_intent_state_explicit": True,
                  "source_and_destination_visible_for_proposal": True,
                  "internal_override_language_removed": True,
                  "corrected_trade_intents_zero": True,
              },
          }
          out = Path(f"output/run_manifests/weekly_etf_cockpit_action_language_validation_{os.environ.get('GITHUB_RUN_ID', 'unknown')}.json")
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(json.dumps(payload, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          print(f"ETF_COCKPIT_ACTION_LANGUAGE_EVIDENCE_WRITTEN | path={out}")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/run_manifests/weekly_etf_cockpit_action_language_validation_*.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Persist ETF cockpit action-language validation [skip ci]"
          git push origin HEAD:main
