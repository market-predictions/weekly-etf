name: Validate ETF final integrity closeout

on:
  push:
    branches:
      - main
    paths:
      - "control/run_queue/validate_etf_final_integrity_closeout_*.md"

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pytest pyyaml
      - name: Run final integrity suites
        run: |
          python -m py_compile runtime/portfolio_rotation_engine.py
          python -m pytest tests/test_etf_final_integrity_closeout.py
          python -m pytest tests/test_etf_instrument_constraints.py
          python -m pytest tests/test_etf_report_portfolio_integrity.py
      - name: Persist validation evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          payload = {
              "artifact_type": "weekly_etf_final_integrity_closeout_validation",
              "status": "completed",
              "contracts": {
                  "zero_trade_churn_status_removed": True,
                  "july14_history_comment_normalized": True,
                  "portfolio_watchlist_integrity_regressions_passed": True,
              },
          }
          path = Path("output/run_manifests/weekly_etf_final_integrity_closeout_validation.json")
          path.write_text(json.dumps(payload, indent=2) + "\n", encoding="utf-8")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/run_manifests/weekly_etf_final_integrity_closeout_validation.json
          git commit -m "Persist ETF final integrity validation [skip ci]"
          git push origin HEAD:main
