name: Validate ETF executed replay state contract

on:
  pull_request:
    paths:
      - "runtime/executed_replay_state_contract.py"
      - "runtime/executed_report_contradiction_cleanup.py"
      - "runtime/nonheld_watchlist_replay_cleanup.py"
      - "runtime/link_runtime_report_tickers.py"
      - "runtime/fix_executed_report_contract.py"
      - "runtime/fix_executed_report_contract_legacy.py"
      - "tests/test_executed_replay_state_contract.py"
      - "tests/test_executed_report_contradiction_cleanup.py"
      - "tests/test_nonheld_watchlist_replay_cleanup.py"
      - ".github/workflows/validate-etf-executed-replay-state.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependency
        run: python -m pip install pytest

      - name: Compile replay compatibility boundary
        run: |
          python -m py_compile \
            runtime/executed_replay_state_contract.py \
            runtime/executed_report_contradiction_cleanup.py \
            runtime/nonheld_watchlist_replay_cleanup.py \
            runtime/link_runtime_report_tickers.py \
            runtime/fix_executed_report_contract.py \
            runtime/fix_executed_report_contract_legacy.py

      - name: Run positive and planted no-action tests
        run: |
          python -m pytest -q \
            tests/test_executed_replay_state_contract.py \
            tests/test_executed_report_contradiction_cleanup.py \
            tests/test_nonheld_watchlist_replay_cleanup.py
