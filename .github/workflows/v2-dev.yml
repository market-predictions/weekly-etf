name: v2 dev (US rebuild)

# Development runner for the v2 rebuild. Runs the task named in v2/ci_task.txt
# and commits generated evidence/state back to the v2-us branch.
on:
  push:
    branches: [v2-us]
    paths: ["v2/**", ".github/workflows/v2-us.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v2-us
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq libpango-1.0-0 libpangoft2-1.0-0 >/dev/null
          pip install requests==2.32.3 PyYAML==6.0.2 weasyprint==70.0
      - name: Run task
        env:
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
          EODHD_API_TOKEN: ${{ secrets.EODHD_API_TOKEN }}
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          STOOQ_API_KEY: ${{ secrets.STOOQ_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          MRKT_RPRTS_SMTP_HOST: ${{ secrets.MRKT_RPRTS_SMTP_HOST }}
          MRKT_RPRTS_SMTP_PORT: ${{ secrets.MRKT_RPRTS_SMTP_PORT }}
          MRKT_RPRTS_SMTP_USER: ${{ secrets.MRKT_RPRTS_SMTP_USER }}
          MRKT_RPRTS_SMTP_PASS: ${{ secrets.MRKT_RPRTS_SMTP_PASS }}
          MRKT_RPRTS_MAIL_FROM: ${{ secrets.MRKT_RPRTS_MAIL_FROM }}
          V2_TRIAL_TO: ${{ secrets.V2_TRIAL_TO }}
          V2_REHEARSAL: "1"
          V2_DRY_RUN: "1"
          V2_AV_LIMIT: "2"
          V2_PRIMARY: yahoo
          V2_VERIFIER: alpha_vantage
          V2_EODHD_LIMIT: "3"
        run: |
          set -euo pipefail
          for TASK in $(cat v2/ci_task.txt); do
            echo "=== TASK=$TASK"
            python -m "v2.$TASK"
          done
      - name: Commit results back
        if: always()
        run: |
          set -euo pipefail
          git config user.name "v2-us-bot"
          git config user.email "v2-us-bot@users.noreply.github.com"
          for d in v2/evidence v2/state; do if [ -d "$d" ]; then git add -f "$d"; fi; done
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "v2: results of $(tr '\n' ' ' < v2/ci_task.txt) [skip ci]"
          git push origin HEAD:v2-us
