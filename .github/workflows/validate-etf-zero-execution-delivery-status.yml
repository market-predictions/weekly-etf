name: Validate ETF zero-execution delivery status

on:
  push:
    branches:
      - main
    paths:
      - "control/run_queue/weekly_etf_zero_execution_status_validation_*.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install focused dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pyyaml

      - name: Compile focused implementation
        run: |
          python -m py_compile \
            runtime/__init__.py \
            runtime/delivery_action_status_contract.py \
            runtime/delivery_html_overrides.py \
            tests/test_etf_delivery_action_status_contract.py

      - name: Run focused regressions
        run: pytest -q tests/test_etf_delivery_action_status_contract.py

      - name: Replay exact July 24 zero-intent state
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          from runtime import render_cockpit_front_page  # installs runtime delivery patches
          from runtime import delivery_html_overrides as delivery

          state = json.loads(Path("output/runtime/etf_report_state_20260724_20260726_130440.json").read_text(encoding="utf-8"))
          assert state.get("trade_intents") == []
          assert state["rotation_plan"]["trade_intents"] == []

          en_snapshot = delivery._post_execution_action_snapshot_html(delivery, state, "en")
          nl_snapshot = delivery._post_execution_action_snapshot_html(delivery, state, "nl")
          en_rotation = delivery._rotation_plan_html(delivery, state, "en")
          nl_rotation = delivery._rotation_plan_html(delivery, state, "nl")

          for html in (en_snapshot, en_rotation):
              assert "No portfolio change was proposed or executed this run" in html
              assert "rotation is already reflected" not in html.lower()
          for html in (nl_snapshot, nl_rotation):
              assert "geen portefeuillewijziging voorgesteld of uitgevoerd" in html.lower()
              assert "rotatie is al verwerkt" not in html.lower()
          assert "Portfolio decision status" in en_snapshot
          assert "Status portefeuillebesluit" in nl_snapshot
          print("ETF_ZERO_EXECUTION_DELIVERY_STATUS_OK | trade_intents=0 | reflected_rotation_copy=absent | no_change_status=explicit")
          PY

      - name: Persist validation evidence
        if: always()
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          payload = {
              "schema_version": "1.0",
              "artifact_type": "weekly_etf_zero_execution_delivery_status_validation",
              "created_at_utc": datetime.now(timezone.utc).isoformat(),
              "github_run_id": os.environ.get("GITHUB_RUN_ID"),
              "status": "completed",
              "contract": {
                  "zero_trade_intents_confirmed": True,
                  "no_change_status_explicit": True,
                  "false_reflected_rotation_copy_removed": True,
                  "actual_execution_copy_preserved_by_regression": True,
              },
          }
          out = Path(f"output/run_manifests/weekly_etf_zero_execution_delivery_status_validation_{os.environ.get('GITHUB_RUN_ID', 'unknown')}.json")
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(json.dumps(payload, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          print(f"ETF_ZERO_EXECUTION_DELIVERY_STATUS_EVIDENCE_WRITTEN | path={out}")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/run_manifests/weekly_etf_zero_execution_delivery_status_validation_*.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Persist ETF zero-execution status validation [skip ci]"
          git push origin HEAD:main
