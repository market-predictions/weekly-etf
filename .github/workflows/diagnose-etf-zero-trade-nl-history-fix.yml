name: Diagnose ETF zero-trade and Dutch-history fix

on:
  push:
    branches:
      - main
    paths:
      - "control/run_queue/etf_zero_trade_nl_history_diagnostic_*.md"

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pytest pyyaml
      - name: Run patch and tests with persisted evidence
        run: |
          set +e
          mkdir -p output/run_manifests
          : > /tmp/fix.log
          python tools/apply_etf_zero_trade_and_nl_history_fix.py >> /tmp/fix.log 2>&1
          patch=$?
          python -m py_compile runtime/etf_instrument_constraints.py runtime/render_etf_report_nl_from_state.py tools/validate_etf_rotation_output_contract.py tools/validate_etf_report_portfolio_integrity.py >> /tmp/fix.log 2>&1
          compile=$?
          python -m pytest tests/test_etf_zero_trade_and_nl_history.py -q >> /tmp/fix.log 2>&1
          focused=$?
          python -m pytest tests/test_etf_instrument_constraints.py -q >> /tmp/fix.log 2>&1
          constraints=$?
          python -m pytest tests/test_etf_report_portfolio_integrity.py -q >> /tmp/fix.log 2>&1
          integrity=$?
          python - <<PY
          import json
          from pathlib import Path
          statuses={'patch':$patch,'compile':$compile,'focused':$focused,'constraints':$constraints,'integrity':$integrity}
          log=Path('/tmp/fix.log').read_text(encoding='utf-8',errors='replace')
          payload={'artifact_type':'etf_zero_trade_nl_history_fix_diagnostic','status':'completed' if all(v==0 for v in statuses.values()) else 'failed','statuses':statuses,'log_head':log[:8000],'log_tail':log[-16000:]}
          Path('output/run_manifests/etf_zero_trade_nl_history_fix_diagnostic.json').write_text(json.dumps(payload,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(payload,indent=2))
          PY
      - name: Commit evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/run_manifests/etf_zero_trade_nl_history_fix_diagnostic.json
          git commit -m "Persist ETF zero-trade history diagnostic [skip ci]"
          git push origin HEAD:main
