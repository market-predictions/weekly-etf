# Weekly ETF (US-listed) v2 — universe + European mirror (DRAFT for owner review)
#
# Every instrument is a US-listed ETF, scored on its own USD prices converted to EUR.
# mirror = what the European mirror portfolio holds when the US portfolio holds this fund:
#   twin   = UCITS fund tracking the same or practically the same index
#   proxy  = related UCITS fund ("benadering"), shown as such in the report
#   cash   = no reasonable UCITS equivalent: the mirror holds the money-market fund (XEON)
# mirror.query = Yahoo search text used to find/verify a candidate; mirror.id empty = still to find.
# status: verified after the probe confirms USD closes and a matching fund name.
